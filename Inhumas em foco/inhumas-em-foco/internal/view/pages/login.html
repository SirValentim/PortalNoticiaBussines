{{define "content"}}
<section class="auth-shell">
    <div class="auth-brand-panel">
        <span class="auth-brand-mark">NC</span>
        <h1>{{.AdminSystemName}}</h1>
        <p>{{.AdminSystemDescriptor}}</p>
        <strong>{{.AdminSystemTagline}}</strong>
        <small>Portal atual: {{.CurrentPortalName}}</small>
    </div>

    <div class="auth-card">
        <p class="admin-kicker">Acesso administrativo</p>
        <h2>Entrar no painel</h2>

        {{if .Error}}
        <div class="alert alert-error">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" name="email" class="form-control" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Senha</label>
                <input id="login-password" type="password" name="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg auth-submit">Entrar</button>
        </form>
        <p class="auth-link">
            <a href="/recuperar-senha">Esqueci minha senha</a>
        </p>

        <p class="auth-footnote">
            Acesso restrito a colaboradores autorizados.
        </p>
    </div>
</section>
{{end}}
