{{define "admin_content"}}
<div class="admin-page-header">
    <div>
        <p class="admin-kicker">Territorio</p>
        <h1>Bairros</h1>
    </div>
</div>

<section class="admin-form-section">
    <h3 class="admin-section-title">Novo Bairro</h3>
    <form class="admin-form" method="POST" action="{{.AdminPath}}/neighborhoods" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        <div class="admin-form-grid">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Imagem de capa</label>
                <input type="file" name="cover" class="form-control" accept="image/*">
            </div>
        </div>
        <div class="form-group">
            <label>Descricao</label>
            <textarea name="description" class="form-control" rows="5"></textarea>
        </div>
        <div class="admin-form-grid">
            <div class="form-group">
                <label>Meta Title</label>
                <input type="text" name="meta_title" class="form-control">
            </div>
            <div class="form-group">
                <label>Meta Description</label>
                <input type="text" name="meta_description" class="form-control">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Salvar Bairro</button>
    </form>
</section>

<table class="table">
    <thead>
        <tr><th>Nome</th><th>Slug</th><th>Acoes</th></tr>
    </thead>
    <tbody>
        {{range .Neighborhoods}}
        <tr>
            <td>{{.Name}}</td>
            <td>{{.Slug}}</td>
            <td>
                <form method="POST" action="{{$.AdminPath}}/neighborhoods/{{.ID}}/delete" onsubmit="return confirm('Tem certeza?')">
    <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
                    <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                </form>
            </td>
        </tr>
        {{else}}
        <tr><td colspan="3" class="empty-state">Nenhum bairro cadastrado</td></tr>
        {{end}}
    </tbody>
</table>
{{end}}
