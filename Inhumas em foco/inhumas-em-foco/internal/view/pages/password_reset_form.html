{{define "content"}}
<div class="container" style="max-width:440px;padding-top:60px;">
    <div style="background:#fff;padding:32px;border-radius:8px;box-shadow:var(--shadow);">
        <h1 style="text-align:center;margin-bottom:12px;">Definir nova senha</h1>
        <p style="text-align:center;margin-bottom:24px;color:var(--gray);">Use uma senha forte para acessar o painel.</p>

        {{if .Error}}
        <div class="alert alert-error">{{.Error}}</div>
        {{end}}
        {{if .Success}}
        <div class="alert alert-success">{{.Success}}</div>
        {{end}}

        {{if .CanReset}}
        {{if not .Success}}
        <form method="POST" action="/redefinir-senha/{{.Token}}">
            <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
            <div class="form-group">
                <label>Nova senha</label>
                <input type="password" name="password" class="form-control" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirmar senha</label>
                <input type="password" name="password_confirm" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Atualizar senha</button>
        </form>
        {{end}}
        {{end}}

        <p style="text-align:center;margin-top:16px;font-size:0.9rem;">
            <a href="/login">Voltar ao login</a>
        </p>
    </div>
</div>
{{end}}
