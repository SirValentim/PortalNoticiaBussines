{{define "content"}}
<div class="container" style="max-width:400px;padding-top:60px;">
    <div style="background:#fff;padding:32px;border-radius:8px;box-shadow:var(--shadow);">
        <h1 style="text-align:center;margin-bottom:24px;">Painel Administrativo</h1>
        
        {{if .Error}}
        <div class="alert alert-error">{{.Error}}</div>
        {{end}}
        
        <form method="POST" action="/login">
    <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Entrar</button>
        </form>
        <p style="text-align:center;margin-top:14px;font-size:0.9rem;">
            <a href="/recuperar-senha">Esqueci minha senha</a>
        </p>
        
        <p style="text-align:center;margin-top:16px;font-size:0.85rem;color:var(--gray);">
            Acesso restrito a colaboradores autorizados.
        </p>
    </div>
</div>
{{end}}
