{{define "content"}}
<div class="container" style="padding-top:24px;max-width:600px;">
    <h1 style="margin-bottom:24px;">Contato</h1>
    
    <div style="background:#fff;padding:24px;border-radius:8px;box-shadow:var(--shadow);">
        <p style="margin-bottom:16px;color:var(--gray);">
            Entre em contato conosco para anunciar, enviar sugestoes de pauta ou para qualquer outra informacao.
        </p>
        
        <form method="POST" action="/contato">
    <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Assunto</label>
                <select name="subject" class="form-control">
                    <option value="anuncio">Quero anunciar</option>
                    <option value="pauta">Sugestao de pauta</option>
                    <option value="denuncia">Denuncia</option>
                    <option value="outro">Outro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mensagem</label>
                <textarea name="message" class="form-control" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Enviar mensagem</button>
        </form>
        
        <div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--border);">
            <p style="font-size:0.9rem;color:var(--gray);">
                <strong>Email:</strong> {{.PortalSettings.ContactEmail}}<br>
                <strong>WhatsApp:</strong> {{.PortalSettings.ContactWhatsapp}}
            </p>
        </div>
    </div>
</div>
{{end}}
