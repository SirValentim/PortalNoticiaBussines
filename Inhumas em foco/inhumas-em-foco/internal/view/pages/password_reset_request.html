{{define "content"}}
<div class="container" style="max-width:440px;padding-top:60px;">
    <div style="background:#fff;padding:32px;border-radius:8px;box-shadow:var(--shadow);">
        <h1 style="text-align:center;margin-bottom:12px;">Recuperar senha</h1>
        <p style="text-align:center;margin-bottom:24px;color:var(--gray);">Informe o e-mail cadastrado no painel.</p>

        {{if .Error}}
        <div class="alert alert-error">{{.Error}}</div>
        {{end}}
        {{if .Success}}
        <div class="alert alert-success">{{.Success}}</div>
        {{end}}

        {{if .ResetURL}}
        <div class="alert alert-success">
            Ambiente local: <a href="{{.ResetURL}}">abrir link de redefinicao</a>
        </div>
        {{end}}

        <form method="POST" action="/recuperar-senha">
            <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Enviar instrucoes</button>
        </form>

        <p style="text-align:center;margin-top:16px;font-size:0.9rem;">
            <a href="/login">Voltar ao login</a>
        </p>
    </div>
</div>
{{end}}
