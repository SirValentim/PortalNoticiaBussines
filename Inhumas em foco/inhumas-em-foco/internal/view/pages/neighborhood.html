{{define "content"}}
<section class="detail-hero neighborhood-hero">
    <div class="container detail-hero-inner">
        <img class="detail-cover" src="{{if .Neighborhood.CoverImageKey}}{{imageURL .Neighborhood.CoverImageKey}}{{else}}/static/images/inhumas-hero.png{{end}}" alt="{{.Neighborhood.Name}}" loading="eager">
        <div class="detail-hero-content">
            <span class="badge">Bairro</span>
            <h1>{{.Neighborhood.Name}}</h1>
            <p>{{.Neighborhood.Description}}</p>
        </div>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="section-heading">
            <h2>Comercios do Bairro</h2>
            <a href="/lojas">Ver lojas</a>
        </div>
        <div class="store-grid">
            {{range .Stores}}
            <a class="store-tile store-tile-large" href="/loja/{{.Slug}}">
                <img src="{{if .LogoKey}}{{imageURL .LogoKey}}{{else}}/static/images/logo.png{{end}}" alt="{{.Name}}" loading="lazy">
                <strong>{{.Name}}</strong>
                <span>{{.Category}}</span>
                <small>*****</small>
            </a>
            {{else}}
            <div class="empty-state empty-state-rich">
                <strong>Nenhum comercio cadastrado neste bairro.</strong>
                <span>Novas lojas aparecem aqui quando forem ativadas no painel.</span>
            </div>
            {{end}}
        </div>
    </div>
</section>
{{end}}
