{{define "admin_content"}}
<div class="admin-page-header">
    <div>
        <p class="admin-kicker">Comunidade</p>
        <h1>{{if .Influencer}}Editar{{else}}Novo{{end}} Influencer</h1>
    </div>
    <a href="{{.AdminPath}}/influencers" class="btn btn-sm">Voltar</a>
</div>

<form class="admin-form" method="POST" action="{{if .Influencer}}{{.AdminPath}}/influencers/{{.Influencer.ID}}{{else}}{{.AdminPath}}/influencers{{end}}" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
    <section class="admin-form-section">
        <div class="admin-form-grid">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="name" class="form-control" value="{{if .Influencer}}{{.Influencer.Name}}{{end}}" required>
            </div>
            <div class="form-group">
                <label>Bairro / area de atuacao</label>
                <input type="text" name="city_area" class="form-control" value="{{if .Influencer}}{{.Influencer.CityArea}}{{end}}" placeholder="Ex: Centro, Goiania, Inhumas">
            </div>
            <div class="form-group">
                <label>Nicho / categoria</label>
                <input type="text" name="niche" class="form-control" value="{{if .Influencer}}{{.Influencer.Niche}}{{end}}" placeholder="Ex: gastronomia, moda, humor, esporte">
            </div>
        </div>
        <div class="form-group">
            <label>Bio</label>
            <textarea name="bio" class="form-control" rows="7">{{if .Influencer}}{{.Influencer.Bio}}{{end}}</textarea>
        </div>
    </section>

    <section class="admin-form-section">
        <div class="admin-form-grid">
            <div class="form-group">
                <label>Instagram</label>
                <input type="url" name="instagram" class="form-control" value="{{if .Influencer}}{{.Influencer.Instagram}}{{end}}" placeholder="https://instagram.com/...">
            </div>
            <div class="form-group">
                <label>TikTok</label>
                <input type="url" name="tiktok" class="form-control" value="{{if .Influencer}}{{.Influencer.TikTok}}{{end}}" placeholder="https://tiktok.com/@...">
            </div>
            <div class="form-group">
                <label>YouTube</label>
                <input type="url" name="youtube" class="form-control" value="{{if .Influencer}}{{.Influencer.YouTube}}{{end}}" placeholder="https://youtube.com/...">
            </div>
            <div class="form-group">
                <label>WhatsApp</label>
                <input type="text" name="whatsapp" class="form-control" value="{{if .Influencer}}{{.Influencer.Whatsapp}}{{end}}">
            </div>
        </div>
    </section>

    <section class="admin-form-section">
        <div class="admin-form-grid">
            <div class="form-group">
                <label>Foto / avatar</label>
                {{if and .Influencer .Influencer.AvatarKey}}
                <img class="admin-cover-preview" src="{{imageURL .Influencer.AvatarKey}}">
                <label class="checkbox-control"><input type="checkbox" name="remove_avatar"><span>Remover avatar atual</span></label>
                {{end}}
                <input type="file" name="avatar" class="form-control" accept="image/*">
                {{if .MediaAssets}}
                <label>Ou escolher da biblioteca</label>
                <select name="avatar_media_key" class="form-control">
                    <option value="">Manter / nenhum</option>
                    {{range .MediaAssets}}
                    <option value="{{.Key}}" {{if and $.Influencer (eq $.Influencer.AvatarKey .Key)}}selected{{end}}>{{if .Title}}{{.Title}}{{else}}{{.OriginalName}}{{end}}</option>
                    {{end}}
                </select>
                {{end}}
            </div>
            <div class="form-group">
                <label>Imagem de capa</label>
                {{if and .Influencer .Influencer.CoverImageKey}}
                <img class="admin-cover-preview" src="{{imageURL .Influencer.CoverImageKey}}">
                <label class="checkbox-control"><input type="checkbox" name="remove_cover"><span>Remover capa atual</span></label>
                {{end}}
                <input type="file" name="cover" class="form-control" accept="image/*">
                {{if .MediaAssets}}
                <label>Ou escolher da biblioteca</label>
                <select name="cover_media_key" class="form-control">
                    <option value="">Manter / nenhuma</option>
                    {{range .MediaAssets}}
                    <option value="{{.Key}}" {{if and $.Influencer (eq $.Influencer.CoverImageKey .Key)}}selected{{end}}>{{if .Title}}{{.Title}}{{else}}{{.OriginalName}}{{end}}</option>
                    {{end}}
                </select>
                {{end}}
            </div>
        </div>
        <div class="admin-check-grid">
            <label class="checkbox-control"><input type="checkbox" name="is_featured" {{if .Influencer}}{{if .Influencer.IsFeatured}}checked{{end}}{{end}}><span>Destaque</span></label>
            <label class="checkbox-control"><input type="checkbox" name="is_sponsored" {{if .Influencer}}{{if .Influencer.IsSponsored}}checked{{end}}{{end}}><span>Patrocinado</span></label>
            <label class="checkbox-control"><input type="checkbox" name="active" {{if .Influencer}}{{if .Influencer.Active}}checked{{end}}{{else}}checked{{end}}><span>Ativo</span></label>
        </div>
    </section>

    <section class="admin-form-section">
        <h3>SEO</h3>
        <div class="admin-form-grid">
            <div class="form-group">
                <label>Meta title</label>
                <input type="text" name="meta_title" class="form-control" value="{{if .Influencer}}{{.Influencer.MetaTitle}}{{end}}" maxlength="200">
            </div>
            <div class="form-group">
                <label>Meta description</label>
                <textarea name="meta_description" class="form-control" rows="4" maxlength="300">{{if .Influencer}}{{.Influencer.MetaDescription}}{{end}}</textarea>
            </div>
        </div>
    </section>

    <div class="admin-form-actions">
        <a href="{{.AdminPath}}/influencers" class="btn">Cancelar</a>
        <button type="submit" class="btn btn-primary btn-lg">Salvar influencer</button>
    </div>
</form>
{{end}}
